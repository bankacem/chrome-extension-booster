<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66bb6a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="1000" cy="120" r="200" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1100" cy="500" r="150" fill="rgba(255,255,255,0.02)"/>
  
  <!-- Site logo area (top left) -->
  <rect x="60" y="40" width="200" height="36" rx="18" fill="rgba(255,255,255,0.08)"/>
  <text x="160" y="63" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" letter-spacing="1">extensionto.com</text>
  
  <!-- Category badge -->
  <rect x="60" y="100" width="180" height="32" rx="16" fill="rgba(233,69,96,0.2)" stroke="#e94560" stroke-width="1"/>
  <text x="150" y="120" font-family="Arial, sans-serif" font-size="13" fill="#e94560" text-anchor="middle" font-weight="bold" letter-spacing="0.5">PRODUCTIVITY &amp; TOOLS</text>
  
  <!-- Main Title -->
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="44" fill="#ffffff" font-weight="bold">
    <tspan x="60" dy="0">42 Chrome Extensions</tspan>
    <tspan x="60" dy="52" font-size="38">Tested — Here Are</tspan>
    <tspan x="60" dy="48" font-size="38">the 10 You Need</tspan>
  </text>
  
  <!-- Subtitle / Description -->
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.65)" line-height="1.6">
    <tspan x="60" dy="0">I spent 3 weeks testing 42 extensions across 7 categories.</tspan>
    <tspan x="60" dy="26">Detailed comparison table with RAM usage, speed, and ratings.</tspan>
  </text>
  
  <!-- Stats display (extension categories visualization) -->
  <g transform="translate(60, 430)">
    <!-- Bar 1 -->
    <rect x="0" y="0" width="50" height="80" rx="4" fill="rgba(233,69,96,0.3)"/>
    <rect x="0" y="0" width="50" height="30" rx="4" fill="#e94560"/>
    <text x="25" y="18" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
    <text x="25" y="100" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Ads</text>
    
    <!-- Bar 2 -->
    <rect x="70" y="0" width="50" height="80" rx="4" fill="rgba(52,168,83,0.3)"/>
    <rect x="70" y="0" width="50" height="15" rx="4" fill="#34a853"/>
    <text x="95" y="18" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
    <text x="95" y="100" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Screenshots</text>
    
    <!-- Bar 3 -->
    <rect x="140" y="0" width="50" height="80" rx="4" fill="rgba(251,188,4,0.3)"/>
    <rect x="140" y="0" width="50" height="25" rx="4" fill="#fbbc04"/>
    <text x="165" y="18" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e" text-anchor="middle" font-weight="bold">5</text>
    <text x="165" y="100" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Passwords</text>
    
    <!-- Bar 4 -->
    <rect x="210" y="0" width="50" height="80" rx="4" fill="rgba(233,69,96,0.3)"/>
    <rect x="210" y="0" width="50" height="40" rx="4" fill="#e94560"/>
    <text x="235" y="18" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
    <text x="235" y="100" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Tabs</text>
    
    <!-- Bar 5 -->
    <rect x="280" y="0" width="50" height="80" rx="4" fill="rgba(52,168,83,0.3)"/>
    <rect x="280" y="0" width="50" height="20" rx="4" fill="#34a853"/>
    <text x="305" y="18" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
    <text x="305" y="100" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Dark Mode</text>
    
    <!-- Bar 6 -->
    <rect x="350" y="0" width="50" height="80" rx="4" fill="rgba(251,188,4,0.3)"/>
    <rect x="350" y="0" width="50" height="50" rx="4" fill="#fbbc04"/>
    <text x="375" y="18" font-family="Arial, sans-serif" font-size="13" fill="#1a1a2e" text-anchor="middle" font-weight="bold">8</text>
    <text x="375" y="100" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Productivity</text>
    
    <!-- Bar 7 -->
    <rect x="420" y="0" width="50" height="80" rx="4" fill="rgba(233,69,96,0.3)"/>
    <rect x="420" y="0" width="50" height="35" rx="4" fill="#e94560"/>
    <text x="445" y="18" font-family="Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">6</text>
    <text x="445" y="100" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Security</text>
  </g>
  
  <!-- "10" highlight badge -->
  <circle cx="1050" cy="350" r="80" fill="rgba(52,168,83,0.15)" stroke="#34a853" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="1050" y="335" font-family="Arial, sans-serif" font-size="48" fill="#34a853" text-anchor="middle" font-weight="bold">10</text>
  <text x="1050" y="365" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">Keepers</text>
  
  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.8"/>
</svg>
