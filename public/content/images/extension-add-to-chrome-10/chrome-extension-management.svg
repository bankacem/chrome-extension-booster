<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Manage Chrome extensions</title>
  <desc id="desc">An original browser-style instructional visual showing the Chrome extensions management page with details, site access, disable, and remove controls.</desc>
  <rect width="1200" height="675" rx="28" fill="#f6f8fc"/>
  <rect x="50" y="42" width="1100" height="590" rx="22" fill="#fff" stroke="#d7e0ec" stroke-width="3"/>
  <rect x="50" y="42" width="1100" height="68" rx="22" fill="#17324d"/>
  <circle cx="86" cy="76" r="9" fill="#ff6b6b"/><circle cx="116" cy="76" r="9" fill="#ffd166"/><circle cx="146" cy="76" r="9" fill="#67d391"/>
  <rect x="194" y="59" width="720" height="34" rx="17" fill="#294966"/><text x="220" y="82" font-family="Arial, sans-serif" font-size="17" fill="#dbeafe">chrome://extensions/</text>
  <text x="92" y="160" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#17324d">Manage extensions</text>
  <rect x="92" y="190" width="1000" height="74" rx="16" fill="#f8fafc" stroke="#dce6f1"/>
  <circle cx="138" cy="227" r="24" fill="#dbeafe"/><path d="M138 207v40M118 227h40" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <text x="184" y="219" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#17324d">Quick Screenshot Lite</text>
  <text x="184" y="245" font-family="Arial, sans-serif" font-size="15" fill="#667085">Capture pages · ExtensionTo</text>
  <rect x="744" y="210" width="88" height="34" rx="17" fill="#22c55e"/><circle cx="815" cy="227" r="13" fill="#fff"/>
  <rect x="854" y="208" width="100" height="38" rx="19" fill="#e0ecff"/><text x="875" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Details</text>
  <rect x="974" y="208" width="92" height="38" rx="19" fill="#fee2e2"/><text x="991" y="233" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">Remove</text>
  <rect x="92" y="298" width="1000" height="246" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="126" y="344" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#1e3a8a">Details → Site access</text>
  <text x="126" y="384" font-family="Arial, sans-serif" font-size="17" fill="#1e40af">Choose the narrowest access that still lets the extension work:</text>
  <rect x="126" y="416" width="240" height="58" rx="14" fill="#fff" stroke="#93c5fd"/><text x="157" y="451" font-family="Arial, sans-serif" font-size="16" fill="#334155">When selected</text>
  <rect x="390" y="416" width="240" height="58" rx="14" fill="#fff" stroke="#93c5fd"/><text x="432" y="451" font-family="Arial, sans-serif" font-size="16" fill="#334155">On specific sites</text>
  <rect x="654" y="416" width="240" height="58" rx="14" fill="#fff" stroke="#93c5fd"/><text x="712" y="451" font-family="Arial, sans-serif" font-size="16" fill="#334155">On all sites</text>
  <text x="92" y="590" font-family="Arial, sans-serif" font-size="18" fill="#475569">Use Details to review access; use the toggle to disable and Remove to uninstall.</text>
</svg>
