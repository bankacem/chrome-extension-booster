<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chrome Web Store installation guide</title>
  <desc id="desc">An original browser-style instructional visual showing the Chrome Web Store, an extension listing, and the Add to Chrome button.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient></defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <rect x="46" y="42" width="1108" height="591" rx="22" fill="#fff" stroke="#d8e3f0" stroke-width="3"/>
  <rect x="46" y="42" width="1108" height="68" rx="22" fill="#17324d"/>
  <circle cx="82" cy="76" r="9" fill="#ff6b6b"/><circle cx="112" cy="76" r="9" fill="#ffd166"/><circle cx="142" cy="76" r="9" fill="#67d391"/>
  <rect x="190" y="59" width="650" height="34" rx="17" fill="#294966"/><text x="214" y="82" font-family="Arial, sans-serif" font-size="17" fill="#dbeafe">chromewebstore.google.com</text>
  <text x="82" y="160" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#17324d">Chrome Web Store</text>
  <rect x="82" y="188" width="300" height="42" rx="21" fill="#f1f5f9"/><text x="108" y="216" font-family="Arial, sans-serif" font-size="17" fill="#667085">Search extensions</text>
  <rect x="82" y="270" width="690" height="260" rx="18" fill="#f8fafc" stroke="#dce6f1"/>
  <rect x="112" y="300" width="150" height="150" rx="18" fill="#dbeafe"/><circle cx="187" cy="375" r="47" fill="#3b82f6"/><path d="M187 328v94M140 375h94" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <text x="300" y="336" font-family="Arial, sans-serif" font-weight="700" font-size="25" fill="#17324d">Quick Screenshot Lite</text>
  <text x="300" y="372" font-family="Arial, sans-serif" font-size="17" fill="#667085">Capture a full page or visible browser area.</text>
  <text x="300" y="408" font-family="Arial, sans-serif" font-size="16" fill="#667085">Publisher: ExtensionTo · Productivity</text>
  <rect x="300" y="440" width="210" height="48" rx="24" fill="#2563eb"/><text x="345" y="471" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#fff">Add to Chrome</text>
  <rect x="820" y="270" width="280" height="260" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <text x="852" y="315" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#9a3412">Before you install</text>
  <text x="852" y="355" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">1. Check the publisher</text>
  <text x="852" y="390" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">2. Read the permissions</text>
  <text x="852" y="425" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">3. Review recent updates</text>
  <text x="852" y="460" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">4. Confirm the listing URL</text>
  <text x="82" y="583" font-family="Arial, sans-serif" font-size="18" fill="#475569">Use the official Chrome Web Store, then review the confirmation prompt.</text>
</svg>
