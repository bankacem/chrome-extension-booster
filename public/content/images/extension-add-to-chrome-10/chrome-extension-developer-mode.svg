<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chrome Developer mode and Load unpacked</title>
  <desc id="desc">An original browser-style instructional visual showing Developer mode enabled and the Load unpacked button on the Chrome extensions page.</desc>
  <rect width="1200" height="675" rx="28" fill="#f6f8fc"/>
  <rect x="50" y="42" width="1100" height="590" rx="22" fill="#fff" stroke="#d7e0ec" stroke-width="3"/>
  <rect x="50" y="42" width="1100" height="68" rx="22" fill="#17324d"/>
  <circle cx="86" cy="76" r="9" fill="#ff6b6b"/><circle cx="116" cy="76" r="9" fill="#ffd166"/><circle cx="146" cy="76" r="9" fill="#67d391"/>
  <rect x="194" y="59" width="720" height="34" rx="17" fill="#294966"/><text x="220" y="82" font-family="Arial, sans-serif" font-size="17" fill="#dbeafe">chrome://extensions/</text>
  <text x="92" y="160" font-family="Arial, sans-serif" font-weight="700" font-size="28" fill="#17324d">Extensions</text>
  <rect x="92" y="194" width="1000" height="86" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <text x="128" y="236" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#9a3412">Developer mode</text>
  <text x="128" y="263" font-family="Arial, sans-serif" font-size="15" fill="#7c2d12">Use this only for local testing and development.</text>
  <rect x="900" y="216" width="112" height="42" rx="21" fill="#2563eb"/><circle cx="988" cy="237" r="15" fill="#fff"/>
  <rect x="92" y="318" width="1000" height="198" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="128" y="365" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#1e3a8a">Developer tools</text>
  <rect x="128" y="398" width="230" height="52" rx="26" fill="#2563eb"/><text x="171" y="431" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#fff">Load unpacked</text>
  <rect x="382" y="398" width="230" height="52" rx="26" fill="#fff" stroke="#93c5fd"/><text x="427" y="431" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#1d4ed8">Pack extension</text>
  <text x="128" y="484" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">Choose the folder that contains manifest.json.</text>
  <rect x="730" y="318" width="300" height="198" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="766" y="363" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#166534">Testing reminder</text>
  <text x="766" y="404" font-family="Arial, sans-serif" font-size="16" fill="#166534">Keep the folder stable.</text>
  <text x="766" y="436" font-family="Arial, sans-serif" font-size="16" fill="#166534">Reload after code changes.</text>
  <text x="766" y="468" font-family="Arial, sans-serif" font-size="16" fill="#166534">Use Web Store install for users.</text>
  <text x="92" y="590" font-family="Arial, sans-serif" font-size="18" fill="#475569">Developer mode is for local extension folders, not the usual consumer install path.</text>
</svg>
