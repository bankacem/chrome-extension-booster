<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chrome extension permissions guide</title>
  <desc id="desc">An original browser-style instructional visual showing an extension permission confirmation and a checklist for reviewing access.</desc>
  <rect width="1200" height="675" rx="28" fill="#f6f8fc"/>
  <rect x="72" y="54" width="1056" height="566" rx="24" fill="#fff" stroke="#d7e0ec" stroke-width="3"/>
  <rect x="72" y="54" width="1056" height="64" rx="24" fill="#17324d"/>
  <circle cx="108" cy="86" r="9" fill="#ff6b6b"/><circle cx="138" cy="86" r="9" fill="#ffd166"/><circle cx="168" cy="86" r="9" fill="#67d391"/>
  <rect x="218" y="70" width="650" height="32" rx="16" fill="#294966"/><text x="242" y="92" font-family="Arial, sans-serif" font-size="16" fill="#dbeafe">Chrome · Extension confirmation</text>
  <rect x="150" y="168" width="570" height="350" rx="18" fill="#f8fafc" stroke="#dbe6f2"/>
  <circle cx="222" cy="240" r="40" fill="#2563eb"/><path d="M222 202v76M184 240h76" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <text x="292" y="230" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#17324d">Quick Screenshot Lite</text>
  <text x="292" y="264" font-family="Arial, sans-serif" font-size="17" fill="#667085">Add this extension?</text>
  <line x1="190" y1="308" x2="680" y2="308" stroke="#d7e0ec" stroke-width="2"/>
  <text x="190" y="347" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#334155">Requested access</text>
  <circle cx="202" cy="384" r="7" fill="#2563eb"/><text x="224" y="390" font-family="Arial, sans-serif" font-size="16" fill="#475569">Read the current page when selected</text>
  <circle cx="202" cy="421" r="7" fill="#2563eb"/><text x="224" y="427" font-family="Arial, sans-serif" font-size="16" fill="#475569">Store screenshots you create</text>
  <rect x="474" y="456" width="170" height="44" rx="22" fill="#2563eb"/><text x="512" y="484" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#fff">Add extension</text>
  <rect x="770" y="168" width="290" height="350" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="800" y="214" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#1e3a8a">Permission check</text>
  <text x="800" y="260" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">Does the access match</text>
  <text x="800" y="288" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">the extension’s purpose?</text>
  <rect x="800" y="330" width="218" height="42" rx="12" fill="#dcfce7"/><text x="824" y="357" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#166534">Yes → continue</text>
  <rect x="800" y="390" width="218" height="42" rx="12" fill="#fee2e2"/><text x="824" y="417" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#991b1b">No → cancel</text>
  <text x="150" y="574" font-family="Arial, sans-serif" font-size="18" fill="#475569">More access means more responsibility: read the prompt before approving.</text>
</svg>
