# Minimal override on top of SearXNG's own defaults. Exists for one reason:
# SearXNG disables the JSON output format by default (anti-scraping
# measure) - our workflows need JSON to parse results programmatically.
# Mounted read-only into an ephemeral container started by a `docker run`
# step in the relevant workflow, never deployed anywhere persistent.
use_default_settings: true

server:
  secret_key: "ephemeral-ci-instance-not-a-real-secret"
  limiter: false  # only ever serves one client (the job itself)

search:
  formats:
    - html
    - json
