name: Daily Sitemap Indexing

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 AM UTC daily
  workflow_dispatch: # Allow manual trigger

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Sitemap Indexing
        run: bun run index-sitemap
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}

      - name: Persist indexing state
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/indexed-urls.json
          git diff --cached --quiet || git commit -m "chore: update indexing state [$(date +'%Y-%m-%d %H:%M')]" && git push
