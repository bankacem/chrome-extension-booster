            "squad": "privacy",
            "charter": "Weaves ~6 internal + 3-5 authoritative external links with descriptive anchors; verifies every target slug exists; forbids heading/mid-word links. Domain expertise: Privacy, security, ad-blocking, permissions, safe brows",
