            "squad": "privacy",
            "charter": "Hard gates: >=2550 words (EN body), FAQ 8x H3, Final Verdict tail >120 chars, ToC anchors valid, no heading-links/nested-links/mid-word links, frontmatter YAML parses. Domain expertise: Privacy, security, ad-blocking, pe",
            "skills": [
             "qa-gatekeeper",
             "privacy",
