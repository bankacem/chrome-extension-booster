            "squad": "privacy",
            "charter": "Fetches and dissects live SERP competitors; extracts coverage gaps, content formats, angle opportunities; writes OUTDO-tactics for the writer. Domain expertise: Privacy, security, ad-blocking, permissions, safe browsing.",
            "skills": [
             "serp-analyst",
             "privacy",
             "chrome-ecosystem"
            ]
           },
           "brief-architect": {
