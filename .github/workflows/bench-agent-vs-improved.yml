            "charter": "Drafts the full article body in markdown per brief; E-E-A-T first-person voice; dense, practical, no fluff; hits word targets. Domain expertise: Privacy, security, ad-blocking, permissions, safe browsing. Deep familiarit",
            "skills": [
             "writer",
             "privacy",
             "chrome-ecosystem"
            ]
           },
           "editor": {
            "id": "AG031",
            "role": "editor",
            "squad": "privacy",
            "charter": "Line-edits for clarity, flow, compactness; performs compact-rewrite when drafts truncate; protects FAQ + Final Verdict completeness. Domain expertise: Privacy, security, ad-blocking, permissions, safe browsing. Deep fami",
            "skills": [
             "editor",
