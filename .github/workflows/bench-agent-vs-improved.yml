          MIN_STYLE = {
           "voice": "Professional but conversational. First-person hands-on testing voice where credible ('I tested', 'in my setup') without fabricating lab results. Honest trade-offs and caveats. Zero fluff, zero keyword stuffing, zero marketing hype.",
           "eeat_requirements": [
            "Specific verifiable details: real product names, real settings paths, real browser behaviors",
            "Balanced pros AND cons for every recommended tool",
            "Hedge untestable numbers ('typically', 'in my testing') — never invent precise statistics, studies, or release notes",
            "2026 context where relevant: Manifest V3, AI features, latest Chrome behavior"
           ],
           "banned": [
            "In-conclusion openers (max once, prefer never)",
            "Word counts mentioned in text",
            "Generic anchors like 'click here' or bare URLs",
            "Bold-everything emphasis",
            "Fake first-person anecdotes about lab testing equipment"
           ]
          }

          # ── 5. run: smoke = topic[0] only; full = all 10 ─────────────────────────
          selected = list(TOPICS)[:1] if MODE == "smoke" else list(TOPICS)
          results, skipped = [], []
          for slug in selected:
              tinfo = TOPICS[slug]
              serp_path, n = fetch_serp(slug, tinfo["kw"])
              print(f"SERP {slug}: {n} rows from SearXNG", flush=True)
              if SPENT[0] >= CAP:
                  skipped.append(slug)
                  continue
              for arm in ("improved", "agent"):
                  if SPENT[0] >= CAP:
                      skipped.append(f"{slug}/{arm}")
                      continue
                  print(f"RUN arm={arm} topic={slug} (spent {SPENT[0]}/{CAP} calls)", flush=True)
                  rec = run_child(arm, slug, tinfo, serp_path)
                  results.append(rec)
                  print(f"DONE arm={arm} topic={slug} calls=+{rec.get('stats', {}).get('calls', 0)} "
                        f"err={rec.get('error')}", flush=True)

          # ── 6. summary (every cost figure labeled ESTIMATE) ──────────────────────
          CHECKS = list(next((r["gates"]["checks"] for r in results if r.get("gates")), {}).keys())

          def cost_est(rec):
              s = rec.get("stats", {})
              tin, tout = s.get("in_tok_est", 0), s.get("out_tok_est", 0)
              return tin * P_IN / 1e6 + tout * P_OUT / 1e6, tin, tout

          arm_tot = {}
          for arm in ("improved", "agent"):
              rs = [r for r in results if r["arm"] == arm]
              ok = [r for r in rs if not r.get("error") and r.get("gates")]
              per_check = {c: (sum(1 for r in ok if r["gates"]["checks"].get(c)) , len(ok))
                           for c in CHECKS}
              c_est = sum(cost_est(r)[0] for r in rs)
              tok = (sum(cost_est(r)[1] for r in rs), sum(cost_est(r)[2] for r in rs))
              arm_tot[arm] = {
                  "runs": len(rs), "ok": len(ok), "errors": len(rs) - len(ok),
                  "gates_all_pass": sum(1 for r in ok if r["gates"]["pass"]),
                  "per_gate_pass": {c: f"{p}/{n}" for c, (p, n) in per_check.items()},
                  "llm_calls": sum(r.get("stats", {}).get("calls", 0) for r in rs),
                  "tok_est": tok, "cost_est_usd": round(c_est, 4),
                  "secs": round(sum(r.get("stats", {}).get("secs", 0) for r in rs), 1),
                  "words": [r["gates"]["words"] for r in ok],
              }

          summary = {
              "header": HEADER,
              "spent_llm_calls": SPENT[0], "cap": CAP, "cap_hit": SPENT[0] >= CAP,
              "skipped": skipped,
              "per_topic": [{"slug": r["slug"], "arm": r["arm"], "error": r.get("error"),
                             "words": r.get("gates", {}) and r["gates"].get("words"),
                             "gates_pass": r.get("gates", {}) and r["gates"].get("pass"),
                             "calls": r.get("stats", {}).get("calls", 0),
                             "cost_est_usd": round(cost_est(r)[0], 4),
                             "secs": r.get("secs_total")} for r in results],
              "arm_totals": arm_tot,
          }
          (BENCH_OUT / "summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=1),
                                                  encoding="utf-8")

          md = ["# Bench — agent vs improved (results as artifacts, nothing committed)", "",
                f"- Actual model (both arms): `{resolved['improved']['provider']}/{resolved['improved']['model_id']}` "
                f"(alias `{MODEL}`) — single-model override per owner rule",
                f"- Search source: SearXNG service container ({SEARXNG}); SERP rows/query: {ROWS}",
                f"- Mode: {MODE} | topics: {1 if MODE == 'smoke' else len(TOPICS)} | "
                f"LLM calls spent: {SPENT[0]}/{CAP} | cap hit: {SPENT[0] >= CAP}",
                "- Costs below are ESTIMATES (chars/4 tokens; assumed $0.27/M in, $1.10/M out) — not invoices.",
                "", "| topic | arm | words | gates | calls | tok est | cost est $ | secs | err |",
                "|---|---|---|---|---|---|---|---|---|"]
          for r in results:
              g = r.get("gates") or {}
              s = r.get("stats", {})
              ce = cost_est(r)
              md.append(f"| {r['slug'][:38]} | {r['arm']} | {g.get('words','-')} "
                        f"| {'PASS' if g.get('pass') else 'FAIL'} | {s.get('calls',0)} "
                        f"| {ce[1]+ce[2]:,} | {ce[0]:.4f} | {r.get('secs_total','-')} "
                        f"| {(r.get('error') or '')[:60]} |")
          if skipped:
              md += ["", f"SKIPPED (call cap): {', '.join(skipped)}"]
          md += ["", "## Per-gate pass rate", "", "| gate | improved | agent |", "|---|---|---|"]
          for c in CHECKS:
              md.append(f"| {c} | {arm_tot['improved']['per_gate_pass'].get(c,'-')} "
                        f"| {arm_tot['agent']['per_gate_pass'].get(c,'-')} |")
          md += ["", "## Arm totals (ESTIMATE figures)", "",
                "```json", json.dumps(arm_tot, indent=1), "```",
                "", "Honest notes: engine squad is inline-minimal (registry.json not in repo yet); "
                    "the engine's web_search was patched to SearXNG (z-ai CLI unavailable on CI); "
                    "the engine arm's meta costs ONE extra counted call; improved-arm features "
                    "auto-upgrade once PR #450 merges — see each run's features dict in summary.json."]
          (BENCH_OUT / "summary.md").write_text("\n".join(md), encoding="utf-8")
          print("\n".join(md), flush=True)

          if SPENT[0] >= CAP:
              print(f"LLM_CALL_CAP reached ({SPENT[0]}/{CAP}) — stopping before further calls; "
                    f"partial results uploaded as artifacts.", flush=True)
              sys.exit(2)
          print("BENCH COMPLETE — results in artifacts only.", flush=True)
          PYRUNNER
          python3 "$BENCH_OUT/bench_runner.py"

      - name: Upload results as artifacts (always — even on cap-stop or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-agent-vs-improved-${{ inputs.mode }}-${{ github.run_number }}
          path: ${{ runner.temp }}/bench-001
          retention-days: 30
