name: Refiner Agent (8th agent — metadata fixes + competitor-gap section, oldest-published-first, learns via memory_store)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many oldest un-refined articles to process this run"
        required: false
        default: "1"
      model:
        description: "Force a specific model (optional)"
        required: false
        default: ""

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r seo_agent_pro/requirements.txt

      - name: Setup Bun (for index/sitemap regeneration)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Start SearXNG (ephemeral real-search backend, this job only)
        run: |
          docker run -d --name searxng \
            -p 8080:8080 \
            -v "$(pwd)/seo_agent_pro/searxng-settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng:latest

          echo "Waiting for SearXNG to become ready..."
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/search?q=test&format=json" > /dev/null; then
              echo "SearXNG is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::SearXNG did not become ready in time - refiner.py's competitor-gap analysis will fall back to model-estimated analysis for this run. Not treated as a hard failure."

      - name: Run the Refiner Agent
        id: refine
        env:
          BLUESMINDS_KEY:  ${{ secrets.BLUESMINDS_KEY || secrets.BLUESMINDS }}
          AGENTROUTER_KEY: ${{ secrets.AGENTROUTER_KEY || secrets.AGENTROUTER }}
          GROQ_KEY:        ${{ secrets.GROQ_KEY || secrets.GROQ }}
          OPENROUTER_KEY:  ${{ secrets.OPENROUTER_KEY || secrets.OPENROUTER }}
          SEO_AGENT_MODEL: ${{ github.event.inputs.model }}
          SEARXNG_URL: "http://localhost:8080"
        run: |
          set -o pipefail
          cd seo_agent_pro/agentic
          python3 refine_run.py --count "${{ github.event.inputs.limit }}" 2>&1 | tee /tmp/refine_output.log

      - name: Stop SearXNG
        if: always()
        run: docker rm -f searxng 2>/dev/null || true

      - name: Post debug output if refinement failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Refinement Agent failed - output:"
            echo '```'
            tail -c 8000 /tmp/refine_output.log
            echo '```'
          } > /tmp/debug_body.md
          gh issue create \
            --title "Refinement Agent FAILED ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_body.md \
            --repo ${{ github.repository }}

      - name: Rebuild index and sitemap
        run: |
          bun run sync-articles
          bun run sitemap

      - name: Create branch, commit, and open PR
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="refine/metadata-batch-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          git add public/content/articles
          git add public/content/articles-index.json public/sitemap.xml public/content/sitemap-dates.json
          git add seo_agent_pro/agentic/memory/refined_articles.json seo_agent_pro/agentic/memory/cycle_log.json seo_agent_pro/agentic/memory/lessons.md

          if git diff --cached --quiet; then
            echo "No changes to commit (all flagged files were already clean or nothing was fixable)."
            exit 0
          fi

          git commit -m "refine: metadata-only fixes (meta_description, seo_title, dead links) — batch $(date -u +%Y-%m-%d)

          Generated by the Refinement Agent (seo_agent_pro/agentic/refine_articles.py).
          Article bodies/structure are NOT rewritten — only meta_description,
          seo_title, and stripping any dead '#' links or placeholder images
          that slipped through are touched. See the job log for the exact
          per-file changes."

          git push origin "$BRANCH" --force 2>&1 | tee /tmp/commit_output.log
          PUSH_EXIT=$?
          if [ $PUSH_EXIT -ne 0 ]; then exit 1; fi

          GH_TOKEN=${{ github.token }} gh pr create \
            --title "refine: metadata batch $(date -u +%Y-%m-%d)" \
            --body "Automated metadata-only refinement — see job log for per-file changes. Article bodies are untouched." \
            --base main \
            --head "$BRANCH"

      - name: Post debug output if commit/PR failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Refinement commit/PR step failed - output:"
            echo '```'
            cat /tmp/commit_output.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } > /tmp/debug_commit.md
          gh issue create \
            --title "Refinement Agent commit/PR FAILED ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_commit.md \
            --repo ${{ github.repository }}
