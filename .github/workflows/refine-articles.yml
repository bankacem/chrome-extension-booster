name: Refine Article Metadata (proofread, don't rewrite)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many flagged articles to process this run"
        required: false
        default: "15"
      model:
        description: "Force a specific model (optional)"
        required: false
        default: ""

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r seo_agent_pro/requirements.txt

      - name: Setup Bun (for index/sitemap regeneration)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Run the Refinement Agent
        id: refine
        env:
          BLUESMINDS_KEY:  ${{ secrets.BLUESMINDS_KEY || secrets.BLUESMINDS }}
          AGENTROUTER_KEY: ${{ secrets.AGENTROUTER_KEY || secrets.AGENTROUTER }}
          GROQ_KEY:        ${{ secrets.GROQ_KEY || secrets.GROQ }}
          OPENROUTER_KEY:  ${{ secrets.OPENROUTER_KEY || secrets.OPENROUTER }}
          SEO_AGENT_MODEL: ${{ github.event.inputs.model }}
        run: |
          set -o pipefail
          cd seo_agent_pro/agentic
          python3 refine_articles.py --limit "${{ github.event.inputs.limit }}" 2>&1 | tee /tmp/refine_output.log

      - name: Post debug output if refinement failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Refinement Agent failed - output:"
            echo '```'
            tail -c 8000 /tmp/refine_output.log
            echo '```'
          } > /tmp/debug_body.md
          gh issue create \
            --title "Refinement Agent FAILED ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_body.md \
            --repo ${{ github.repository }}

      - name: Rebuild index and sitemap
        run: |
          bun run sync-articles
          bun run sitemap

      - name: Create branch, commit, and open PR
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="refine/metadata-batch-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          git add public/content/articles
          git add public/content/articles-index.json public/sitemap.xml public/content/sitemap-dates.json

          if git diff --cached --quiet; then
            echo "No changes to commit (all flagged files were already clean or nothing was fixable)."
            exit 0
          fi

          git commit -m "refine: metadata-only fixes (meta_description, seo_title, dead links) — batch $(date -u +%Y-%m-%d)

          Generated by the Refinement Agent (seo_agent_pro/agentic/refine_articles.py).
          Article bodies/structure are NOT rewritten — only meta_description,
          seo_title, and stripping any dead '#' links or placeholder images
          that slipped through are touched. See the job log for the exact
          per-file changes."

          git push origin "$BRANCH" --force 2>&1 | tee /tmp/commit_output.log
          PUSH_EXIT=$?
          if [ $PUSH_EXIT -ne 0 ]; then exit 1; fi

          GH_TOKEN=${{ github.token }} gh pr create \
            --title "refine: metadata batch $(date -u +%Y-%m-%d)" \
            --body "Automated metadata-only refinement — see job log for per-file changes. Article bodies are untouched." \
            --base main \
            --head "$BRANCH"

      - name: Post debug output if commit/PR failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Refinement commit/PR step failed - output:"
            echo '```'
            cat /tmp/commit_output.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } > /tmp/debug_commit.md
          gh issue create \
            --title "Refinement Agent commit/PR FAILED ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_commit.md \
            --repo ${{ github.repository }}
