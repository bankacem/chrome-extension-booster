name: SEO Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'vercel.json'
      - '.github/workflows/seo-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'vercel.json'
      - '.github/workflows/seo-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-quality:
    name: Lint, typecheck, build and SEO smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Python unit tests
        run: python3 -m unittest discover -s seo_agent_pro -p 'test*.py' -v

      - name: Build and prerender
        run: npm run build

      - name: Performance budgets
        run: npm run test:performance

      - name: SEO smoke tests
        run: npm run test:seo

      - name: Internal link smoke tests
        run: npm run test:links

      - name: Browser smoke tests
        run: npm run test:e2e
