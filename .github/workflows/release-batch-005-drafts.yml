name: Release Batch 005 scheduled drafts

on:
  # Polling every 15 minutes catches delayed GitHub cron events.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      release_slug:
        description: 'Exact Batch 005 article slug to release; leave empty for automatic due-slot selection'
        required: false
        default: ''
        type: string

concurrency:
  group: release-batch-005-drafts
  cancel-in-progress: false

jobs:
  release-one:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Release one due and image-ready Batch 005 draft
        env:
          RELEASE_SLUG: ${{ inputs.release_slug }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          schedule=json.loads(Path('editorial/publishing-schedule-batch-005.json').read_text())
          entries=schedule['entries']; now=datetime.now(timezone.utc)
          manual=os.environ.get('RELEASE_SLUG','').strip(); selected=None
          if manual:
              matches=[e for e in entries if e.get('slug')==manual]
              if len(matches)!=1: raise SystemExit(f'Unknown Batch 005 release_slug: {manual}')
              selected=matches[0]
          else:
              candidates=[]
              for e in entries:
                  if e.get('release_enabled') is False or e.get('publish_enabled') is False or not e.get('due_utc'): continue
                  due=datetime.fromisoformat(e['due_utc'].replace('Z','+00:00'))
                  article=Path(e['article_path'])
                  if not article.exists() or not re.search(r'^status:\\s*draft\\s*$',article.read_text(),re.M): continue
                  delta=(now-due).total_seconds()
                  if 0 <= delta <= int(schedule.get('late_window_seconds',604800)): candidates.append((due,e))
              if not candidates:
                  print(f'No due Batch 005 release at {now.isoformat()}; exiting idempotently.'); raise SystemExit(0)
              selected=sorted(candidates,key=lambda x:x[0])[0][1]
          slug=selected['slug']; article=Path(selected['article_path'])
          if not article.exists(): raise SystemExit(f'Missing article: {article}')
          text=article.read_text()
          if not re.search(r'^status:\s*draft\s*$',text,re.M):
              print(f'Already published or not a draft: {slug}; exiting idempotently.'); raise SystemExit(0)
          refs=re.findall(r'!\[[^\]]*\]\((/content/images/[^)]+\.webp)(?:\s+"[^"]*")?\)',text)
          if not refs: raise SystemExit(f'Visual gate failed: no inline WebP in {slug}')
          for ref in refs:
              p=Path('public')/ref.lstrip('/')
              if not p.exists() or not p.with_suffix('.avif').exists(): raise SystemExit(f'Visual gate failed: missing AVIF sibling for {ref}')
          hero=re.search(r'^featured_image:\s*(/content/images/[^\s]+\.webp)',text,re.M)
          if hero:
              p=Path('public')/hero.group(1).lstrip('/')
              if not p.exists() or not p.with_suffix('.avif').exists(): raise SystemExit(f'Visual gate failed: missing featured AVIF sibling for {hero.group(1)}')
          article.write_text(re.sub(r'^status:\s*draft\s*$','status: published',text,count=1,flags=re.M))
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add',str(article)],check=True)
          subprocess.run(['git','commit','-m',f'content: release Batch 005 article {slug}'],check=True)
          subprocess.run(['git','push','origin','main'],check=True)
          print(f'Released Batch 005 {slug}')
          PY
      - name: Rebuild index and Sitemap after release
        if: success()
        run: |
          git fetch origin
          git pull --rebase origin main
          bun run sync-articles
          bun run sitemap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/content/articles-index.json public/sitemap.xml public/content/sitemap-dates.json
          if git diff --cached --quiet; then echo 'Index and Sitemap already synchronized.'; else git commit -m 'chore: refresh index and sitemap after Batch 005 release'; git push origin main; fi
