name: Publish Articles Pipeline

on:
  schedule:
    - cron: '0 9 * * *'   # Daily at 09:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish scheduled articles
        run: node artifacts/extensionto/scripts/github-publish.mjs

      - name: Rebuild index from markdown files
        run: node artifacts/extensionto/scripts/build-index.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add \
            artifacts/extensionto/public/content/articles/ \
            artifacts/extensionto/public/content/articles-index.json \
            artifacts/extensionto/public/content/drafts-index.json

          if git diff --cached --quiet; then
            echo "✅ No changes — all scheduled articles are up to date."
          else
            CHANGED=$(git diff --cached --name-only | wc -l)
            echo "📦 Committing $CHANGED changed file(s)..."
            git commit -m "chore: auto-publish scheduled articles [$(date +'%Y-%m-%d %H:%M UTC')]"
            git push
            echo "✅ Done."
          fi
