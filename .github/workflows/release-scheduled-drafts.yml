name: Release scheduled draft articles

on:
  # GitHub may delay a single cron event. A 15-minute catch-up loop finds the
  # oldest due draft and safely releases one article per run.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      release_slug:
        description: 'Exact article slug to release; leave empty for automatic due-slot selection'
        required: false
        default: ''
        type: string
      release_slot:
        description: 'Legacy slot selector; use release_slug when schedules contain more than one source'
        required: false
        default: ''
        type: string

concurrency:
  group: release-scheduled-drafts-all
  cancel-in-progress: false

jobs:
  release-one:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release one due and image-ready draft
        env:
          RELEASE_SLUG: ${{ inputs.release_slug }}
          RELEASE_SLOT: ${{ inputs.release_slot }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          schedule_paths = [
              Path('editorial/publishing-schedule-day-1-live-test.json'),
              Path('editorial/publishing-schedule-50-active.json'),
              Path('editorial/publishing-schedule-competitive-seo.json'),
              Path('editorial/publishing-schedule-remaining-batch.json'),
          ]
          schedules = [json.loads(p.read_text()) for p in schedule_paths if p.exists()]
          all_entries = []
          for path, schedule in zip(schedule_paths, schedules):
              for entry in schedule.get('entries', []):
                  item = dict(entry)
                  item['_schedule_file'] = str(path)
                  item['_late_window_seconds'] = int(schedule.get('late_window_seconds', 604800))
                  all_entries.append(item)

          now = datetime.now(timezone.utc)
          manual_slug = os.environ.get('RELEASE_SLUG', '').strip()
          manual_slot = os.environ.get('RELEASE_SLOT', '').strip()
          selected = None

          if manual_slug:
              matches = [e for e in all_entries if e.get('slug') == manual_slug]
              if not matches:
                  raise SystemExit(f'Unknown release_slug: {manual_slug}')
              # Prefer the earliest due row when a test row and a later row share a slug.
              selected = sorted(matches, key=lambda e: e.get('due_utc') or '9999')[0]
          elif manual_slot:
              if not manual_slot.isdigit():
                  raise SystemExit('release_slot must be numeric; prefer release_slug')
              matches = [e for e in all_entries if str(e.get('slot', e.get('release_slot', ''))) == manual_slot or str(e.get('release_slot', '')) == manual_slot]
              if len(matches) != 1:
                  raise SystemExit(f'release_slot is ambiguous or unknown ({manual_slot}); use release_slug')
              selected = matches[0]
          else:
              candidates = []
              for e in all_entries:
                  if e.get('release_enabled') is False or e.get('publish_enabled') is False:
                      continue
                  if not e.get('due_utc'):
                      continue
                  due_at = datetime.fromisoformat(e['due_utc'].replace('Z', '+00:00'))
                  article_path = Path(e.get('article_path') or f"public/content/articles/{e['slug'][0]}/{e['slug'][1]}/{e['slug'][2]}/{e['slug']}.md")
                  if not article_path.exists():
                      continue
                  article_text = article_path.read_text()
                  if not re.search(r'^status:\\s*draft\\s*$', article_text, re.M):
                      continue
                  delta = (now - due_at).total_seconds()
                  if 0 <= delta <= e['_late_window_seconds']:
                      candidates.append((due_at, e))
              if candidates:
                  selected = sorted(candidates, key=lambda x: x[0])[0][1]
              else:
                  print(f'No due release at {now.isoformat()}; exiting idempotently.')
                  raise SystemExit(0)

          slug = selected['slug']
          if slug == 'zoom-chrome-extension-guide':
              print('Zoom is already published; refusing duplicate release.')
              raise SystemExit(0)
          if selected.get('release_enabled') is False or selected.get('publish_enabled') is False:
              raise SystemExit(f'Release gate disabled for {slug}')

          article = Path(selected.get('article_path') or f'public/content/articles/{slug[0]}/{slug[1]}/{slug[2]}/{slug}.md')
          if not article.exists():
              raise SystemExit(f'Missing article: {article}')
          text = article.read_text()
          if not re.search(r'^status:\s*draft\s*$', text, re.M):
              print(f'Already published or not a draft: {slug}; exiting idempotently.')
              raise SystemExit(0)

          refs = re.findall(r'!\[[^\]]*\]\((/content/images/[^)]+\.webp)\)', text)
          if not refs:
              raise SystemExit(f'Visual gate failed: no inline WebP in {slug}')
          for ref in refs:
              asset = Path('public') / ref.lstrip('/')
              if not asset.exists() or not asset.with_suffix('.avif').exists():
                  raise SystemExit(f'Visual gate failed: missing AVIF sibling for {ref}')
          featured = re.search(r'^featured_image:\s*(/content/images/[^\s]+\.webp)', text, re.M)
          if featured:
              asset = Path('public') / featured.group(1).lstrip('/')
              if not asset.exists() or not asset.with_suffix('.avif').exists():
                  raise SystemExit(f'Visual gate failed: missing featured AVIF sibling for {featured.group(1)}')

          article.write_text(re.sub(r'^status:\s*draft\s*$', 'status: published', text, count=1, flags=re.M))
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', str(article)], check=True)
          subprocess.run(['git', 'commit', '-m', f'content: release scheduled article {slug}'], check=True)
          subprocess.run(['git', 'push', 'origin', 'main'], check=True)
          print(f'Released {slug} from {selected.get("_schedule_file")}')
          PY

      - name: Rebuild index and Sitemap after release
        if: success()
        run: |
          git fetch origin
          git pull --rebase origin main
          bun run sync-articles
          bun run sitemap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/content/articles-index.json public/sitemap.xml public/content/sitemap-dates.json
          if git diff --cached --quiet; then
            echo 'Index and Sitemap already synchronized.'
          else
            git commit -m 'chore: refresh index and sitemap after scheduled release'
            git push origin main
          fi
