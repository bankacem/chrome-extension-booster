name: Daily Article Generation

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC
  workflow_dispatch: {}  # Manual trigger for testing (re-registered)

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r seo_agent_pro/requirements.txt

      - name: Setup Bun (for index/sitemap regeneration)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Generate today's article
        id: gen
        env:
          # Accept either naming convention actually present in repo
          # secrets (BLUESMINDS_KEY vs BLUESMINDS, etc.) — whichever is set.
          BLUESMINDS_KEY:  ${{ secrets.BLUESMINDS_KEY || secrets.BLUESMINDS }}
          AGENTROUTER_KEY: ${{ secrets.AGENTROUTER_KEY || secrets.AGENTROUTER }}
          GROQ_KEY:        ${{ secrets.GROQ_KEY || secrets.GROQ }}
          OPENROUTER_KEY:  ${{ secrets.OPENROUTER_KEY || secrets.OPENROUTER }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          set -o pipefail
          python3 seo_agent_pro/daily_article.py 2>&1 | tee /tmp/gen_output.log

      - name: Debug - show gen step outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "article_title=[${{ steps.gen.outputs.article_title }}]"
            echo ""
            echo "article_slug=[${{ steps.gen.outputs.article_slug }}]"
            echo ""
            echo "article_keyword=[${{ steps.gen.outputs.article_keyword }}]"
            echo ""
            echo "article_path=[${{ steps.gen.outputs.article_path }}]"
            echo ""
            echo "--- raw GITHUB_OUTPUT file ---"
            echo '```'
            cat "$GITHUB_OUTPUT" || echo "(could not read)"
            echo '```'
          } > /tmp/debug_outputs.md
          gh issue create \
            --title "DEBUG: gen step outputs ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_outputs.md \
            --repo ${{ github.repository }}

      - name: Post debug output if generation failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Generation step failed - output:"
            echo '```'
            tail -c 6000 /tmp/gen_output.log
            echo '```'
          } > /tmp/debug_body.md
          gh issue create \
            --title "Daily article generation FAILED ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_body.md \
            --repo ${{ github.repository }}

      - name: Rebuild index and sitemap
        run: |
          bun run sync-articles
          bun run sitemap

      - name: Create branch and commit
        id: commit
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          BRANCH="daily-article/${{ steps.gen.outputs.article_slug }}"
          git checkout -b "$BRANCH" 2>&1 | tee -a /tmp/commit_output.log

          git add "${{ steps.gen.outputs.article_path }}" 2>&1 | tee -a /tmp/commit_output.log
          git add public/content/articles-index.json public/sitemap.xml 2>&1 | tee -a /tmp/commit_output.log
          git add seo_agent_pro/daily_article_state.json 2>&1 | tee -a /tmp/commit_output.log
          # Without this, seo_memory.json is written locally on the runner and
          # thrown away at the end of the job — the strategy engine sees
          # "0 articles written" every single day forever, which is why so
          # many articles opened with the same generic template.
          git add seo_agent_pro/seo_memory.json 2>&1 | tee -a /tmp/commit_output.log

          git commit -m "feat: daily article — ${{ steps.gen.outputs.article_title }}" 2>&1 | tee -a /tmp/commit_output.log
          COMMIT_EXIT=$?

          git push origin "$BRANCH" --force 2>&1 | tee -a /tmp/commit_output.log
          PUSH_EXIT=$?

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ $COMMIT_EXIT -ne 0 ] || [ $PUSH_EXIT -ne 0 ]; then
            exit 1
          fi

      - name: Post debug output if commit/push failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Commit/push step failed - output:"
            echo '```'
            cat /tmp/commit_output.log 2>/dev/null || echo "(no log captured)"
            echo '```'
            echo ""
            echo "## git status at time of failure"
            echo '```'
            git status 2>&1
            echo '```'
          } > /tmp/debug_commit.md
          gh issue create \
            --title "Daily article commit/push FAILED ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_commit.md \
            --repo ${{ github.repository }}

      - name: Open Pull Request for review
        run: |
          set +e
          cat > /tmp/pr_body.md << PRBODY
          Auto-generated by the daily pipeline (agentrouter gpt-4o).

          **Keyword:** ${{ steps.gen.outputs.article_keyword }}
          **Slug:** ${{ steps.gen.outputs.article_slug }}
          **File:** ${{ steps.gen.outputs.article_path }}

          Please review the article content before merging - this is auto-generated and has not been human-reviewed yet. Check for:
          - Factual accuracy
          - Tone and quality
          - A real featured image (currently defaults to the site's generic og-image.png)
          PRBODY

          GH_TOKEN=${{ github.token }} gh pr create \
            --title "Daily article: ${{ steps.gen.outputs.article_title }}" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" 2>&1 | tee /tmp/pr_output.log
          exit ${PIPESTATUS[0]}

      - name: Post debug output if PR creation failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## PR creation step failed - output:"
            echo '```'
            cat /tmp/pr_output.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } > /tmp/debug_pr.md
          gh issue create \
            --title "Daily article PR creation FAILED ($(date -u +%Y-%m-%dT%H:%M:%SZ))" \
            --body-file /tmp/debug_pr.md \
            --repo ${{ github.repository }}
