name: Daily Article Generation

# Daily unattended article generation for extensionto.com (main project).
#
# Provider chain (seo_agent_pro/daily_article.py MODEL_FALLBACK_CHAIN) now
# starts with "cleanapis-writer" (cleanapis.com deepseek-v4-pro-0813) — the
# same proven writer that produced every tiksnaptok daily/batch article
# unattended in GitHub Actions. Legacy providers remain as fallbacks.
#
# Pushes the finished article + regenerated index/sitemap DIRECTLY to main
# (same unattended pattern proven on the tiksnaptok repo), and opens an
# issue only when something fails so failures are visible without spamming.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily — staggered after tiksnaptok (06:00)
  workflow_dispatch: {}

concurrency:
  group: daily-article-main
  cancel-in-progress: false

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r seo_agent_pro/requirements.txt

      - name: Setup Bun (for index/sitemap regeneration)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Generate today's article
        id: gen
        env:
          # cleanapis first (repo secret CLEANAPIS), legacy providers as fallback
          CLEANAPIS_KEY:   ${{ secrets.CLEANAPIS || secrets.CLEANAPIS_KEY }}
          BLUESMINDS_KEY:  ${{ secrets.BLUESMINDS_KEY || secrets.BLUESMINDS }}
          AGENTROUTER_KEY: ${{ secrets.AGENTROUTER_KEY || secrets.AGENTROUTER }}
          GROQ_KEY:        ${{ secrets.GROQ_KEY || secrets.GROQ }}
          OPENROUTER_KEY:  ${{ secrets.OPENROUTER_KEY || secrets.OPENROUTER }}
        run: |
          set -o pipefail
          python3 seo_agent_pro/daily_article.py 2>&1 | tee /tmp/gen_output.log

      - name: Rebuild index and sitemap
        if: success()
        run: |
          bun run sync-articles
          bun run sitemap

      - name: Commit and push to main
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add -A public/content/articles
          git add public/content/articles-index.json public/sitemap.xml public/content/sitemap-dates.json
          git add seo_agent_pro/daily_article_state.json
          # Without this, seo_memory.json is written locally on the runner and
          # thrown away at the end of the job — the strategy engine sees
          # "0 articles written" every single day forever.
          git add seo_agent_pro/seo_memory.json

          if git diff --cached --quiet; then
            echo "No changes to commit (article already present?)"
            exit 0
          fi

          git commit -m "feat: daily article — ${{ steps.gen.outputs.article_title }} (${{ steps.gen.outputs.article_slug }})"
          git push origin main

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Daily article run failed"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```'
            tail -c 6000 /tmp/gen_output.log 2>/dev/null || echo "(no generation log captured)"
            echo '```'
          } > /tmp/fail_body.md
          gh issue create \
            --title "Daily article FAILED ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/fail_body.md \
            --repo ${{ github.repository }}
